[package]
name = "quicknote"
version = "0.1.0"
description = "快捷记事本 - 一个轻量的本地 Markdown 记事本"
authors = ["gaozhichang"]
license = "MIT"
repository = "https://github.com/gaozhichang/easy_note_promptgenie"
edition = "2021"

[lib]
name = "quicknote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
